# Package identity, content and declared dependencies (ADR B). Replace
# your-plugin-name with the repository name and keep the version, name and
# dependencies identical to .claude-plugin/plugin.json: the manifest is a
# projection of this file and the gate fails when the two disagree.
schema_version: 1
package:
  name: your-plugin-name
  version: 0.1.0
  type: capability
content:
  skills: ./skills
  agents: ./agents
  knowledge: ./knowledge
  verification: ./verification
  evals: ./evals
dependencies:
  capabilities:
    - name: core
  knowledge: []
