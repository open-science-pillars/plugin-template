# Package identity, content, dependencies, presentation metadata and REACH
# (ADR B). The Claude package files and the Agent Plugins package are
# rendered from this file by build-kit's osp.py render; the gate fails on
# a hand edit to any of them.
schema_version: 1
package:
  name: your-plugin-name
  version: 0.1.0
  type: capability
content:
  skills: ./skills
  agents: ./agents
  knowledge: ./knowledge
  verification: ./verification
  evals: ./evals
dependencies:
  capabilities:
  - name: core
  knowledge: []
metadata:
  description: 'Replace: one sentence, keyword-first, what domain and datasets this plugin covers.'
  keywords:
  - replace
  - with
  - domain
  - keywords
